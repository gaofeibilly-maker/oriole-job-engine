name: Oriole daily nationwide update

on:
  # Legacy GitHub schedule retired after the Tencent migration; manual evidence runs remain available.
  workflow_dispatch:
    inputs:
      force:
        description: Run again even if the current Beijing-date marker exists
        required: false
        type: boolean
        default: false

concurrency:
  # Every writer shares one persistent-state lock across workflows.
  group: oriole-state-writer
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      HUANGQUE_BAIDU_API_KEY: ${{ secrets.HUANGQUE_BAIDU_API_KEY }}
      HUANGQUE_DAILY_MAX_COLLECTIONS: "100"
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - name: Checkout durable Oriole state
        uses: actions/checkout@v6
        with:
          ref: oriole-state
          path: state
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
      - name: Verify and restore the compressed Registry bundle
        shell: bash
        run: |
          set -euo pipefail
          node source/scripts/huangque/state-bundle.mjs unpack --state-dir state/state-data
      - name: Run once for the current Beijing date
        env:
          FORCE_DAILY: ${{ inputs.force || false }}
          HUANGQUE_RUNTIME_ROOT: ${{ github.workspace }}/state/state-data
          HUANGQUE_REGISTRY_PATH: ${{ github.workspace }}/state/state-data/registry.json
          HUANGQUE_ARTIFACT_ROOT: ${{ runner.temp }}/oriole-artifacts
          HUANGQUE_EMPLOYER_UNIVERSE_PATH: ${{ github.workspace }}/state/state-data/employer-universe.json
        shell: bash
        working-directory: source
        run: |
          if [[ "$FORCE_DAILY" == "true" ]]; then
            npm run daily -- --force
          else
            npm run daily
          fi
      - name: Persist complete Registry and receipts
        if: always()
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          test -f state-data/registry.json
          node ../source/scripts/huangque/state-bundle.mjs pack --state-dir state-data
          rm -f -- state-data/registry.json
          test ! -e state-data/registry.json
          FORBIDDEN="$(find state-data \( -type l -o -name '*.lock' -o -name '*.tmp' -o -name '*.backup' \) -print -quit)"
          if [[ -n "${FORBIDDEN}" ]]; then
            echo "Refusing to persist a symlink, lock, temporary, or backup path: ${FORBIDDEN}" >&2
            exit 1
          fi
          git config user.name "Oriole State Bot"
          git config user.email "actions@users.noreply.github.com"
          stage_path() {
            if [[ -e "$1" ]] || git ls-files --error-unmatch "$1" >/dev/null 2>&1; then
              git add -A -- "$1"
            fi
          }
          stage_path state-data/registry.json
          stage_path state-data/registry.json.gz
          stage_path state-data/registry.bundle-manifest.json
          stage_path state-data/latest-job-update.json
          stage_path state-data/latest-audit.json
          stage_path state-data/hosted-snapshot.json
          stage_path state-data/job-updates
          if ! git diff --cached --quiet; then
            git commit -m "state: job update ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:oriole-state
          fi
      - name: Upload run and audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oriole-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/state-data/latest-job-update.json
            state/state-data/latest-audit.json
            state/state-data/hosted-snapshot.json
            state/state-data/registry.json.gz
            state/state-data/registry.bundle-manifest.json
            ${{ runner.temp }}/oriole-artifacts
          if-no-files-found: warn
          retention-days: 30
