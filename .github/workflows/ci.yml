name: Oriole CI

on:
  push:
    branches-ignore:
      - oriole-state
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Run complete public release verification
        run: npm run verify
