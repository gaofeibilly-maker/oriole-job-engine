name: Oriole source spider

on:
  # Legacy GitHub schedule retired after the Tencent migration; manual evidence runs remain available.
  workflow_dispatch:
    inputs:
      deep:
        description: Run the weekly deep-scan budget now
        required: false
        type: boolean
        default: false

concurrency:
  group: oriole-state-writer
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
      HUANGQUE_BAIDU_API_KEY: ${{ secrets.HUANGQUE_BAIDU_API_KEY }}
      HUANGQUE_BAIDU_DAILY_BUDGET: "300"
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - name: Checkout durable Oriole state
        uses: actions/checkout@v6
        with:
          ref: oriole-state
          path: state
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
      - name: Verify and restore the compressed Registry bundle
        shell: bash
        run: |
          set -euo pipefail
          node source/scripts/huangque/state-bundle.mjs unpack --state-dir state/state-data
      - name: Run bounded employer source spider
        env:
          HUANGQUE_RUNTIME_ROOT: ${{ github.workspace }}/state/state-data
          HUANGQUE_REGISTRY_PATH: ${{ github.workspace }}/state/state-data/registry.json
          HUANGQUE_ARTIFACT_ROOT: ${{ runner.temp }}/oriole-artifacts
          HUANGQUE_EMPLOYER_UNIVERSE_PATH: ${{ github.workspace }}/state/state-data/employer-universe.json
          HUANGQUE_SOURCE_SPIDER_STATE_PATH: ${{ github.workspace }}/state/state-data/source-spider-state.json
          HUANGQUE_SOURCE_SPIDER_MAX_EMPLOYERS: ${{ (github.event.schedule == '30 19 * * 6' || inputs.deep) && '150' || '100' }}
          HUANGQUE_SOURCE_SPIDER_MAX_PROBES: ${{ (github.event.schedule == '30 19 * * 6' || inputs.deep) && '40' || '20' }}
          DEEP_SCAN: ${{ github.event.schedule == '30 19 * * 6' || inputs.deep || false }}
        working-directory: source
        shell: bash
        run: |
          if [[ "$DEEP_SCAN" == "true" ]]; then
            npm run source-spider -- --deep
          else
            npm run source-spider
          fi
      - name: Persist spider queue, Registry and receipt
        if: always()
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          test -f state-data/registry.json
          node ../source/scripts/huangque/state-bundle.mjs pack --state-dir state-data
          rm -f -- state-data/registry.json
          test ! -e state-data/registry.json
          FORBIDDEN="$(find state-data \( -type l -o -name '*.lock' -o -name '*.tmp' -o -name '*.backup' \) -print -quit)"
          if [[ -n "${FORBIDDEN}" ]]; then
            echo "Refusing to persist a symlink, lock, temporary, or backup path: ${FORBIDDEN}" >&2
            exit 1
          fi
          git config user.name "Oriole State Bot"
          git config user.email "actions@users.noreply.github.com"
          stage_path() {
            if [[ -e "$1" ]] || git ls-files --error-unmatch "$1" >/dev/null 2>&1; then
              git add -A -- "$1"
            fi
          }
          stage_path state-data/registry.json
          stage_path state-data/registry.json.gz
          stage_path state-data/registry.bundle-manifest.json
          stage_path state-data/source-spider-state.json
          stage_path state-data/latest-source-spider.json
          stage_path state-data/source-spider-runs
          if ! git diff --cached --quiet; then
            git commit -m "state: source spider ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:oriole-state
          fi
      - name: Upload source-discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oriole-source-spider-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/state-data/latest-source-spider.json
            state/state-data/source-spider-state.json
            state/state-data/registry.json.gz
            state/state-data/registry.bundle-manifest.json
            ${{ runner.temp }}/oriole-artifacts
          if-no-files-found: warn
          retention-days: 30
